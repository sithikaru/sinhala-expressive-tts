dataset:
  name: "sinhala_expressive"
  sampling_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0

model:
  encoder_layers: 4
  encoder_heads: 2
  decoder_layers: 4
  decoder_heads: 2
  hidden_dim: 256
  dropout: 0.1
  emotion_dim: 256
  emotions: ["neutral", "sad", "angry"]

train:
  batch_size: 16
  learning_rate: 0.001
  grad_clip_thresh: 1.0
  seed: 42